                    <a href="./index.html#anggota">Anggota</a>
                    <a href="./index.html#dkr">DKR</a>
                    <a href="./index.html#kegiatan">Kegiatan</a>
                    <a href="./gallery.html" class="active">Gallery</a>
                    <a href="./index.html#faq">FAQ</a>
                    <a href="./index.html#contact">Kontak</a>

            <button class="lightbox-close" id="lightbox-close" type="button"

                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="lightbox-content" role="dialog" aria-modal="true"

                <img id="lightbox-image" src="" alt="">
                <p id="lightbox-title"></p>
            </div>
        </div>
